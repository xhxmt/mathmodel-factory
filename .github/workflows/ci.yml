name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF evidence tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra web --extra tui --group dev --locked
      - run: uv run python -m compileall -q factory_core cloud web/backend
      - run: >-
          uv run pytest -q
          -m "not latex"
          --ignore=tests/test_cloud_solver_monitor.py
          --ignore=tests/test_cloud_solver_security.py
          --ignore=tests/test_cloud_solver_api_persistence.py
          --ignore=tests/test_control_plane_uploads.py
          --ignore=tests/test_web_frontend_runtime_helpers.py
          --ignore=tests/test_web_control_plane_api.py
          --ignore=tests/test_cumcm2025a_exact_oracle.py
          --ignore=tests/test_cumcm2025a_occlusion_model.py
      - name: Driver guard against the committed tree fixture
        run: >-
          uv run python scripts/check_no_hand_written_drivers.py
          tests/fixtures/driver_guard_tree
          --exempt legacy_controller.before.py
      - run: git diff --check

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          texlive-latex-base texlive-latex-extra texlive-bibtex-extra
          texlive-xetex biber
      - run: uv sync --group dev --locked
      - run: command -v pdflatex && command -v xelatex && command -v bibtex && command -v biber
      - run: uv run pytest -q tests/test_paper_sources.py -m latex --strict-markers

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: uv sync --extra web --group dev --locked
      - run: npm ci
        working-directory: web/frontend
      - run: uv run pytest -q tests/test_web_control_plane_api.py tests/test_control_plane_uploads.py tests/test_web_frontend_runtime_helpers.py
      - run: node --test tests/state-adaptation.test.mjs tests/joint-modeling.test.mjs tests/step-display.test.mjs
        working-directory: web/frontend
      - run: npm run build
        working-directory: web/frontend

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra cloud --group dev --locked
      - run: >-
          uv run pytest -q
          tests/test_cloud_solver_monitor.py
          tests/test_cloud_solver_security.py
          tests/test_cloud_solver_api_persistence.py
          tests/test_cloud_solver_routing.py
          tests/test_solver_service.py
          tests/test_cumcm2025a_exact_oracle.py
          tests/test_cumcm2025a_occlusion_model.py
