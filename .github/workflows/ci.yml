name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare an identical-tree audit source fixture
        run: |
          ci_source_commit="$(git rev-parse HEAD)"
          ci_source_tree="$(git rev-parse 'HEAD^{tree}')"
          ci_source_time="$(git show -s --format=%cI HEAD)"
          ci_fixture_commit="$(printf 'CI source fixture for %s\n' "$ci_source_commit" |
            GIT_AUTHOR_DATE="$ci_source_time" GIT_COMMITTER_DATE="$ci_source_time" \
            git -c user.name='CI source fixture' -c user.email='ci@example.invalid' \
              commit-tree "$ci_source_tree" -p "$ci_source_commit")"
          git checkout --detach "$ci_fixture_commit"
          test "$(git rev-parse 'HEAD^{tree}')" = "$ci_source_tree"
      - name: Install native evidence and sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build libcap-dev poppler-utils
          # Phase9 uses overlay mounts, which require Bubblewrap >= 0.11.
          bwrap_archive="$RUNNER_TEMP/bubblewrap-0.11.2.tar.xz"
          curl --fail --location --retry 3 \
            https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz \
            --output "$bwrap_archive"
          printf '69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6  %s\n' "$bwrap_archive" | sha256sum --check
          tar -xf "$bwrap_archive" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/bubblewrap-build" "$RUNNER_TEMP/bubblewrap-0.11.2" \
            -Dsupport_setuid=false -Dtests=false -Dman=disabled \
            -Dbash_completion=disabled -Dzsh_completion=disabled -Dselinux=disabled
          ninja -C "$RUNNER_TEMP/bubblewrap-build"
          sudo install -m 0755 "$RUNNER_TEMP/bubblewrap-build/bwrap" /usr/bin/bwrap
          bwrap --version
          bwrap --unshare-all --new-session --die-with-parent --overlay-src / --tmp-overlay / --proc /proc --dev /dev /bin/true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind the native Node and npm paths used by audit fixtures
        run: |
          sudo ln -sf "$(command -v node)" /usr/bin/node
          sudo ln -sf "$(command -v npm)" /usr/bin/npm
          /usr/bin/node --version
          /usr/bin/npm --version
      - uses: actions/setup-python@v5
        with:
          # M0.3 golden pins explicitly include the interpreter patch version.
          python-version: "3.13.5"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra web --group dev --locked
      - run: uv run python -m compileall -q factory_core cloud web/backend
      - run: >-
          uv run pytest -q
          -m "not latex"
          --ignore=tests/test_cloud_solver_monitor.py
          --ignore=tests/test_cloud_solver_security.py
          --ignore=tests/test_cloud_solver_api_persistence.py
          --ignore=tests/test_control_plane_uploads.py
          --ignore=tests/test_web_frontend_runtime_helpers.py
          --ignore=tests/test_web_control_plane_api.py
          --ignore=tests/test_cumcm2025a_exact_oracle.py
          --ignore=tests/test_cumcm2025a_occlusion_model.py
      - run: git diff --check

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          texlive-latex-base texlive-latex-extra texlive-bibtex-extra
          texlive-xetex biber
      - run: uv sync --group dev --locked
      - run: command -v pdflatex && command -v xelatex && command -v bibtex && command -v biber
      - run: uv run pytest -q tests/test_paper_sources.py -m latex --strict-markers

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: uv sync --extra web --group dev --locked
      - run: npm ci
        working-directory: web/frontend
      - run: uv run pytest -q tests/test_web_control_plane_api.py tests/test_control_plane_uploads.py tests/test_web_frontend_runtime_helpers.py
      - run: node --test tests/state-adaptation.test.mjs tests/joint-modeling.test.mjs tests/phase6-controller.test.mjs
        working-directory: web/frontend
      - run: npm run build
        working-directory: web/frontend

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra cloud --group dev --locked
      - run: >-
          uv run pytest -q
          tests/test_cloud_solver_monitor.py
          tests/test_cloud_solver_security.py
          tests/test_cloud_solver_api_persistence.py
          tests/test_cloud_solver_routing.py
          tests/test_solver_service.py
          tests/test_cumcm2025a_exact_oracle.py
          tests/test_cumcm2025a_occlusion_model.py
