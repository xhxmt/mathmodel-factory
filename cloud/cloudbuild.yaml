steps:
  # Step 0: Validate immutable-image, private-IAM, and quarantine invariants.
  - id: 'preflight'
    name: 'python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93'
    entrypoint: 'python'
    args: ['scripts/validate_cloudbuild.py', 'cloud/cloudbuild.yaml']

  # Step 1: Build the immutable production image plus a browse-only latest tag.
  - id: 'build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--label'
      - 'org.opencontainers.image.revision=${COMMIT_SHA}'
      - '--label'
      - 'paper-factory.cloud-build-id=${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/solver-api:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/solver-api:latest'
      - '.'
    dir: 'cloud'

  # Step 2: Push exactly the tags produced above.
  - id: 'push'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/solver-api'

  # Step 3: Deploy the BUILD_ID tag. latest is never a production target.
  - id: 'deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/solver-api:${BUILD_ID}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--memory'
      - '8Gi'
      - '--cpu'
      - '4'
      - '--timeout'
      - '3600'
      - '--concurrency'
      - '1'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--no-cpu-throttling'
      - '--service-account'
      - '${_RUNTIME_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--labels'
      - 'cloud-build-id=${BUILD_ID},commit-sha=${SHORT_SHA}'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=${PROJECT_ID},SOLVER_BUCKET=${PROJECT_ID}-solver-jobs,SOLVER_EXECUTION_ENABLED=false,SOLVER_BUILD_ID=${BUILD_ID},SOLVER_COMMIT_SHA=${COMMIT_SHA}'

  # Step 4: Record revision, build, commit, tag, and resolved image digest in logs.
  - id: 'record-deployment'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        revision="$$(gcloud run services describe '${_SERVICE_NAME}' --region '${_REGION}' --project '${PROJECT_ID}' --format='value(status.latestReadyRevisionName)')"
        resolved_image="$$(gcloud run revisions describe "$$revision" --region '${_REGION}' --project '${PROJECT_ID}' --format='value(spec.containers[0].image)')"
        printf '{"service":"%s","revision":"%s","build_id":"%s","commit_sha":"%s","image_tag":"%s","resolved_image":"%s"}\n' \
          '${_SERVICE_NAME}' "$$revision" '${BUILD_ID}' '${COMMIT_SHA}' \
          '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/solver-api:${BUILD_ID}' "$$resolved_image"

substitutions:
  _REGION: 'europe-west4'
  _REPOSITORY: 'solver-images'
  _SERVICE_NAME: 'solver-api'
  _RUNTIME_SERVICE_ACCOUNT: 'solver-runner'

timeout: '1800s'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/solver-api:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/solver-api:latest'
