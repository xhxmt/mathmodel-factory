[project]
name = "modeling-factory"
version = "2.0.0"
description = "Versioned orchestration engine and control-plane adapters for Modeling Factory"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5"]

[project.optional-dependencies]
models = [
  "google-antigravity==0.1.0",
]
web = [
  "bcrypt==5.0.0",
  "fastapi==0.138.1",
  "pydantic==2.13.4",
  "PyJWT>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart==0.0.29",
  "uvicorn[standard]==0.47.0",
  "websockets==16.0",
]
tui = [
  "textual==8.2.8",
  "websockets==16.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "httpx2==2.9.1",
  "numpy>=1.26,<3",
  "pytest>=8,<10",
]

[project.scripts]
factory = "factory_core.cli:main"
factory-tui = "apps.tui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "factory_core*", "scripts*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "latex: requires the pinned LaTeX/BibTeX/Biber CI toolchain",
]
