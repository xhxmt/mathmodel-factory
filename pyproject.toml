[project]
name = "modeling-factory"
version = "2.0.0"
description = "Versioned orchestration engine and control-plane adapters for Modeling Factory"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
models = [
  "google-antigravity==0.1.0",
]
web = [
  "bcrypt==5.0.0",
  "fastapi==0.138.1",
  "pydantic==2.13.4",
  "PyJWT>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart==0.0.29",
  "uvicorn[standard]==0.47.0",
  "websockets==16.0",
]
cloud = [
  "aiofiles>=23.2,<25",
  "cylp>=0.94,<1",
  "fastapi==0.138.1",
  "google-cloud-storage>=2.14,<3",
  "matplotlib>=3.8,<4",
  "mip>=1.17,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "psutil>=5.9,<7",
  "pydantic==2.13.4",
  "pydantic-settings>=2.5,<3",
  "pyscipopt>=6.2,<7",
  "python-multipart==0.0.29",
  "scipy>=1.12,<2",
  "sympy>=1.12,<2",
  "uvicorn[standard]==0.47.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest>=8,<10",
]

[project.scripts]
factory = "factory_core.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "cloud*", "factory_core*", "scripts*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
