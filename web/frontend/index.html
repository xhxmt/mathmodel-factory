<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建模工坊</title>
  <meta name="color-scheme" content="light dark">
  <!-- Self-hosted Latin font subsets (woff2). CJK glyphs fall through the --sans stack to system fonts, so the console works offline. -->
  <link rel="preload" href="/fonts/fonts.css" as="style">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    /* ===================================================================
       PAPER FACTORY · 研究工具
       浅色为默认并跟随系统切换深色；中性底色 + 唯一强调色（蓝）。
       琥珀只表示“需要你处理”，绿/红只表示完成/失败。
       旧组件使用的令牌名（--panel、--live、--amber、--grad…）保留，
       映射到新色板，这样所有对话框自动换成同一套配色。
       =================================================================== */
    :root {
      --bg:        #f7f7f5;
      --bg-2:      #efefec;
      --surface:   #ffffff;
      --panel:     #ffffff;
      --panel-2:   #f4f4f1;
      --panel-3:   #ebebe7;
      --line:      #e6e5e0;
      --line-2:    #d4d3cd;
      --glass-hi:  transparent;
      --grid:      transparent;

      --ink:       #1d1d1b;
      --ink-2:     #5b5a55;
      --ink-3:     #8e8c85;

      --accent:      #2f5bd3;
      --accent-2:    #2448ad;
      --accent-dim:  #eaf0fd;
      --accent-line: #b9cbf5;
      --accent-glow: transparent;
      --accent-ink:  #ffffff;
      --brand:   var(--accent);
      --brand-2: var(--accent);
      --brand-3: var(--ok);
      --grad:      var(--accent);
      --grad-soft: var(--accent-dim);
      --aur-1: transparent; --aur-2: transparent; --aur-3: transparent; --aur-4: transparent; --aur-5: transparent;

      /* 需要你处理 */
      --amber:      #a35a00;
      --amber-2:    #8a4b00;
      --amber-ink:  #ffffff;
      --amber-dim:  #fdf3e1;
      --amber-line: #f0cf95;
      --amber-glow: transparent;

      /* 运行中 = 强调色 */
      --live:      var(--accent);
      --live-2:    var(--accent-2);
      --live-dim:  var(--accent-dim);
      --live-line: var(--accent-line);
      --live-glow: transparent;

      --ok:        #1f7a4d;
      --ok-dim:    #e7f4ec;
      --ok-glow:   transparent;

      --bad:       #c03535;
      --err:       #c03535;
      --bad-dim:   #fbeaea;
      --bad-glow:  transparent;

      --paused:    #807e77;
      --paused-dim:#efeeea;

      --overlay:   rgba(29, 29, 27, 0.32);

      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'Hanken Grotesk', sans-serif;

      --r-xs: 4px; --r-sm: 6px; --r: 8px; --r-lg: 10px; --r-xl: 14px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow:    0 1px 2px rgba(29,29,27,0.06), 0 4px 14px rgba(29,29,27,0.06);
      --shadow-lg: 0 2px 6px rgba(29,29,27,0.08), 0 18px 48px rgba(29,29,27,0.14);
      --header-h: 56px;
      --content-w: 1180px;
      color-scheme: light;
    }

    /* 深色：跟随系统，或用户显式选择 */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #151515; --bg-2: #1b1b1b; --surface: #1c1c1c; --panel: #1c1c1c; --panel-2: #232323; --panel-3: #2b2b2b;
        --line: #2c2c2b; --line-2: #3a3a38;
        --ink: #ecebe7; --ink-2: #a9a7a1; --ink-3: #74726d;
        --accent: #7c9cf5; --accent-2: #9db5fa; --accent-dim: #1f2740; --accent-line: #34437a; --accent-ink: #0f1424;
        --amber: #f0b45a; --amber-2: #f6c67d; --amber-ink: #241500; --amber-dim: #33270f; --amber-line: #5c4518;
        --ok: #5cc28c; --ok-dim: #16301f; --bad: #f07a7a; --err: #f07a7a; --bad-dim: #3a1d1d;
        --paused: #8f8d87; --paused-dim: #262625;
        --overlay: rgba(0, 0, 0, 0.55);
        --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.3);
        --shadow-lg: 0 2px 6px rgba(0,0,0,0.4), 0 18px 48px rgba(0,0,0,0.5);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #151515; --bg-2: #1b1b1b; --surface: #1c1c1c; --panel: #1c1c1c; --panel-2: #232323; --panel-3: #2b2b2b;
      --line: #2c2c2b; --line-2: #3a3a38;
      --ink: #ecebe7; --ink-2: #a9a7a1; --ink-3: #74726d;
      --accent: #7c9cf5; --accent-2: #9db5fa; --accent-dim: #1f2740; --accent-line: #34437a; --accent-ink: #0f1424;
      --amber: #f0b45a; --amber-2: #f6c67d; --amber-ink: #241500; --amber-dim: #33270f; --amber-line: #5c4518;
      --ok: #5cc28c; --ok-dim: #16301f; --bad: #f07a7a; --err: #f07a7a; --bad-dim: #3a1d1d;
      --paused: #8f8d87; --paused-dim: #262625;
      --overlay: rgba(0, 0, 0, 0.55);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.3);
      --shadow-lg: 0 2px 6px rgba(0,0,0,0.4), 0 18px 48px rgba(0,0,0,0.5);
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 { font-weight: 600; letter-spacing: 0; color: var(--ink); }

    code, pre, .mono { font-family: var(--mono); }
    .mono { font-size: 0.92em; }
    .tnum { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    #app { position: relative; min-height: 100vh; display: flex; flex-direction: column; }

    /* 小标题：中文、常规字距，不再用等宽大写 */
    .label {
      font: 500 12px/1.4 var(--sans);
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink-3);
    }

    /* 面板：白底细边，无毛玻璃 */
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
    }
    .panel-2 { background: var(--panel-2); }

    /* 按钮 */
    .btn {
      font: 500 13px/1.2 var(--sans);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 12px;
      border-radius: var(--r);
      border: 1px solid var(--line-2);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s var(--ease), border-color 0.12s var(--ease), color 0.12s var(--ease);
    }
    .btn:hover { background: var(--panel-2); }
    .btn:active { transform: translateY(0.5px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn svg { width: 15px; height: 15px; }

    /* 主按钮。类名 .btn-amber 沿用旧调用点，外观为实心强调色。 */
    .btn-amber, .btn-primary {
      background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    }
    .btn-amber:hover, .btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
    .btn-ghost:hover { background: var(--panel-2); color: var(--ink); }
    .btn-danger { color: var(--bad); border-color: var(--line-2); background: var(--surface); }
    .btn-danger:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
    .btn-sm { padding: 5px 9px; font-size: 12.5px; gap: 5px; }
    .btn-sm svg { width: 14px; height: 14px; }
    .btn-icon { padding: 7px; }
    .btn-icon.btn-sm { padding: 5px; }

    /* 表单 */
    .field {
      width: 100%;
      font: 14px var(--sans);
      padding: 8px 11px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r);
      color: var(--ink);
      transition: border-color 0.12s var(--ease), box-shadow 0.12s var(--ease);
    }
    .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .field::placeholder { color: var(--ink-3); }
    textarea.field { resize: vertical; line-height: 1.6; }

    /* 状态点 */
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--ink-3); }
    .dot.live   { background: var(--live); animation: pulse 2s var(--ease) infinite; }
    .dot.amber  { background: var(--amber); }
    .dot.ok     { background: var(--ok); }
    .dot.bad    { background: var(--bad); }
    .dot.paused { background: var(--paused); }

    /* 状态标签（新组件共用） */
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font: 500 12px/1 var(--sans); white-space: nowrap;
      padding: 4px 8px; border-radius: 999px;
      background: var(--panel-2); color: var(--ink-2);
    }
    .pill.live   { background: var(--accent-dim); color: var(--accent); }
    .pill.amber  { background: var(--amber-dim); color: var(--amber); }
    .pill.ok     { background: var(--ok-dim); color: var(--ok); }
    .pill.bad    { background: var(--bad-dim); color: var(--bad); }
    .pill.paused { background: var(--paused-dim); color: var(--paused); }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    .rise { animation: rise 0.25s var(--ease-out) both; }

    .spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--line-2); border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: content-box; }
    * { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

    ::selection { background: var(--accent-dim); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .katex { font-size: 1.04em; }
    .katex-display { overflow-x: auto; overflow-y: hidden; margin: 0.9em 0; padding: 2px 0; }
    .md-mathraw { color: var(--amber); font-family: var(--mono); font-size: 0.9em; }

    .ws-overlay-loading, .overlay-loading {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
    }
    .tab-fallback { display: flex; align-items: center; justify-content: center; min-height: 200px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
  <script>
    /* 最坏情况的自救：浏览器仍持有旧 index.html，而它引用的入口 chunk 已被新
       部署替换 → 入口 404、整页空白（此时没有任何业务 JS 能运行）。
       入口脚本报错时做一次受保护的整页刷新；同一个入口 URL 只重试一次，避免
       真实网络故障时变成无限刷新循环。
       必须放在 <head>：构建产物会把入口 <script type="module"> 注入到 head 末尾，
       这个监听器要先于它注册才能捕获加载失败。 */
    (function () {
      var RECOVERED_KEY = 'pf:entry-recovery-src';
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (!target || target.tagName !== 'SCRIPT') return;
        var src = target.getAttribute('src') || '';
        if (src.indexOf('/assets/') === -1) return;
        try {
          if (sessionStorage.getItem(RECOVERED_KEY) === src) return;
          sessionStorage.setItem(RECOVERED_KEY, src);
        } catch (error) {
          return; /* storage 不可用时不要冒险触发刷新循环 */
        }
        window.location.reload();
      }, true);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
