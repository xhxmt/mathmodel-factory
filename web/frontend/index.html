<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Factory — 建模工坊控制台</title>
  <meta name="color-scheme" content="dark light">
  <!-- Self-hosted Latin font subsets (woff2). CJK glyphs fall through the --sans stack to system fonts, so the console works offline. -->
  <link rel="preload" href="/fonts/fonts.css" as="style">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    /* ===================================================================
       PAPER FACTORY · "Aurora Glass"
       Deep-space dark + violet/cyan/emerald aurora glow, frosted-glass
       panels, vivid status colors. Brand gradient = decorative accent;
       amber stays reserved for "needs you" semantics.
       =================================================================== */
    :root, [data-theme="dark"] {
      --bg:        #070810;
      --bg-2:      #0a0c15;
      /* frosted glass surfaces */
      --panel:     rgba(255,255,255,0.045);
      --panel-2:   rgba(255,255,255,0.075);
      --panel-3:   rgba(255,255,255,0.11);
      --line:      rgba(255,255,255,0.09);
      --line-2:    rgba(255,255,255,0.17);
      --glass-hi:  rgba(255,255,255,0.16);
      --grid:      rgba(255,255,255,0.028);

      --ink:       #eef0f6;
      --ink-2:     #a6adbb;
      --ink-3:      #6b7280;

      /* Aurora brand — decorative gradient accent */
      --brand:     #a78bfa;
      --brand-2:   #22d3ee;
      --brand-3:   #34d399;
      --accent:    #a78bfa;
      --accent-dim: rgba(167,139,250,0.16);
      --accent-line:rgba(167,139,250,0.42);
      --accent-glow:rgba(167,139,250,0.42);
      --accent-ink:#0d0a18;
      --grad:      linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      --grad-soft: linear-gradient(135deg, rgba(167,139,250,0.20), rgba(34,211,238,0.15));

      /* Aurora background blobs (soft radial washes, alpha baked in) */
      --aur-1: rgba(124,58,237,0.22);
      --aur-2: rgba(34,211,238,0.14);
      --aur-3: rgba(16,185,129,0.12);
      --aur-4: rgba(167,139,250,0.13);
      --aur-5: rgba(34,211,238,0.10);

      /* Amber — reserved for "needs you" / gate stop semantics */
      --amber:     #fbbf24;
      --amber-2:   #fcd34d;
      --amber-ink: #1a1300;
      --amber-dim: rgba(251,191,36,0.14);
      --amber-line:rgba(251,191,36,0.42);
      --amber-glow:rgba(251,191,36,0.42);

      /* Live cyan — running / data flowing */
      --live:      #22d3ee;
      --live-2:    #0891b2;
      --live-dim:  rgba(34,211,238,0.14);
      --live-line: rgba(34,211,238,0.42);
      --live-glow: rgba(34,211,238,0.45);

      --ok:        #34d399;
      --ok-dim:    rgba(52,211,153,0.14);
      --ok-glow:   rgba(52,211,153,0.40);

      --bad:       #fb7185;
      --err:       #fb7185;
      --bad-dim:   rgba(251,113,133,0.14);
      --bad-glow:  rgba(251,113,133,0.42);

      --paused:    #94a3b8;
      --paused-dim:rgba(148,163,184,0.14);

      --overlay:   rgba(5,6,12,0.62);

      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'Hanken Grotesk', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      --r-xs: 4px; --r-sm: 7px; --r: 9px; --r-lg: 14px; --r-xl: 18px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow:    0 10px 34px rgba(0,0,0,0.5);
      --shadow-lg: 0 26px 74px rgba(0,0,0,0.66);
      --header-h: 60px;
    }

    [data-theme="light"] {
      --bg:        #f2f4fa;
      --bg-2:      #e9ecf4;
      --panel:     rgba(255,255,255,0.58);
      --panel-2:   rgba(255,255,255,0.72);
      --panel-3:   rgba(255,255,255,0.88);
      --line:      rgba(20,24,40,0.10);
      --line-2:    rgba(20,24,40,0.18);
      --glass-hi:  rgba(255,255,255,0.9);
      --grid:      rgba(20,24,40,0.045);

      --ink:       #171a26;
      --ink-2:     #4c5266;
      --ink-3:     #8a90a3;

      --brand:     #7c5ce0;
      --brand-2:   #0e9db8;
      --brand-3:   #18a06b;
      --accent:    #7c5ce0;
      --accent-dim: rgba(124,92,224,0.14);
      --accent-line:rgba(124,92,224,0.42);
      --accent-glow:rgba(124,92,224,0.28);
      --accent-ink:#ffffff;
      --grad:      linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      --grad-soft: linear-gradient(135deg, rgba(124,92,224,0.16), rgba(14,157,184,0.12));

      --aur-1: rgba(124,92,224,0.14);
      --aur-2: rgba(14,157,184,0.10);
      --aur-3: rgba(24,160,107,0.08);
      --aur-4: rgba(124,92,224,0.09);
      --aur-5: rgba(14,157,184,0.07);

      --amber:     #b45309;
      --amber-2:   #92400e;
      --amber-ink: #fff6e6;
      --amber-dim: rgba(180,83,9,0.12);
      --amber-line:rgba(180,83,9,0.40);
      --amber-glow:rgba(180,83,9,0.22);

      --live:      #0e9db8;
      --live-2:    #0b7a90;
      --live-dim:  rgba(14,157,184,0.12);
      --live-line: rgba(14,157,184,0.40);
      --live-glow: rgba(14,157,184,0.22);

      --ok:        #18a06b;
      --ok-dim:    rgba(24,160,107,0.12);
      --ok-glow:   rgba(24,160,107,0.22);

      --bad:       #dc2647;
      --err:       #dc2647;
      --bad-dim:   rgba(220,38,71,0.10);
      --bad-glow:  rgba(220,38,71,0.22);

      --paused:    #6b7280;
      --paused-dim:rgba(107,114,128,0.12);

      --overlay:   rgba(238,240,248,0.66);

      --shadow:    0 8px 26px rgba(20,24,40,0.10);
      --shadow-lg: 0 24px 58px rgba(20,24,40,0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink);
      background-color: var(--bg);
      /* gradient signal hairline (top) + faint engineering grid for texture */
      background-image:
        linear-gradient(90deg, transparent, var(--accent-line), var(--live), transparent),
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 100% 1px, 34px 34px, 34px 34px;
      background-position: top center, center top, center top;
      background-repeat: no-repeat, repeat, repeat;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.4s var(--ease), color 0.4s var(--ease);
    }

    /* Animated aurora field — two fixed layers of soft radial blobs.
       Soft edges come from the gradients themselves (no filter:blur), and only
       transform is animated, so compositing stays cheap under backdrop-filter. */
    body::before, body::after {
      content: '';
      position: fixed;
      inset: -6%;
      z-index: 0;
      pointer-events: none;
      will-change: transform;
    }
    body::before {
      background:
        radial-gradient(40% 34% at 20% 26%, var(--aur-1), transparent 70%),
        radial-gradient(36% 30% at 80% 16%, var(--aur-2), transparent 70%),
        radial-gradient(34% 36% at 62% 76%, var(--aur-3), transparent 70%);
      animation: auroraA 30s ease-in-out infinite alternate;
    }
    body::after {
      background:
        radial-gradient(30% 26% at 70% 58%, var(--aur-4), transparent 70%),
        radial-gradient(26% 24% at 30% 82%, var(--aur-5), transparent 70%);
      animation: auroraB 40s ease-in-out infinite alternate;
    }
    @keyframes auroraA { from { transform: translate3d(-2%, -1%, 0) scale(1); }    to { transform: translate3d(2%, 2%, 0) scale(1.06); } }
    @keyframes auroraB { from { transform: translate3d(2%, 1%, 0) scale(1.05); }   to { transform: translate3d(-2%, -2%, 0) scale(1); } }

    h1, h2, h3, h4, h5, h6 { font-weight: 700; letter-spacing: -0.01em; }

    code, pre, .mono { font-family: var(--mono); }
    .tnum { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

    a { color: var(--live); text-decoration: none; }
    a:hover { text-decoration: underline; }

    #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* ---- micro-typography utility ---- */
    .label {
      font: 500 10.5px/1 var(--mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ---- glass panels ---- */
    .panel {
      background: var(--panel);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: inset 0 1px 0 var(--glass-hi);
    }
    .panel-2 { background: var(--panel-2); }

    /* ---- buttons ---- */
    .btn {
      font: 600 13px/1 var(--sans);
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 14px;
      border-radius: var(--r);
      border: 1px solid var(--line-2);
      background: var(--panel-2);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s var(--ease), border-color 0.15s var(--ease),
                  transform 0.08s var(--ease), box-shadow 0.15s var(--ease), filter 0.15s var(--ease);
    }
    .btn:hover { background: var(--panel-3); border-color: var(--ink-3); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .btn svg { width: 15px; height: 15px; }

    /* Primary CTA. Class name kept (.btn-amber) to avoid touching every call
       site; visually it is now the aurora brand gradient. */
    .btn-amber {
      background: var(--grad); color: var(--accent-ink);
      border-color: transparent; font-weight: 700;
      box-shadow: 0 4px 18px var(--accent-glow);
    }
    .btn-amber:hover {
      background: var(--grad); border-color: transparent;
      filter: brightness(1.08);
      box-shadow: 0 6px 26px var(--accent-glow), 0 0 0 1px var(--accent-line);
    }
    .btn-ghost { background: rgba(255,255,255,0.02); border-color: var(--line); }
    .btn-ghost:hover { background: var(--panel-2); border-color: var(--line-2); }
    .btn-danger { color: var(--bad); border-color: var(--bad-dim); background: var(--bad-dim); }
    .btn-danger:hover { background: var(--bad); color: #fff; border-color: transparent; box-shadow: 0 4px 18px var(--bad-glow); }
    .btn-sm { padding: 6px 10px; font-size: 12px; gap: 5px; }
    .btn-sm svg { width: 13px; height: 13px; }
    .btn-icon { padding: 8px; }
    .btn-icon.btn-sm { padding: 6px; }

    /* ---- form fields ---- */
    .field {
      width: 100%;
      font: 14px var(--sans);
      padding: 11px 13px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line-2);
      border-radius: var(--r);
      color: var(--ink);
      transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
    }
    [data-theme="light"] .field { background: rgba(255,255,255,0.6); }
    .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .field::placeholder { color: var(--ink-3); }
    textarea.field { resize: vertical; line-height: 1.6; }

    /* ---- status dot ---- */
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--ink-3); }
    .dot.live   { background: var(--live);  box-shadow: 0 0 10px var(--live-glow);  animation: pulse 2s var(--ease) infinite; }
    .dot.amber  { background: var(--amber); box-shadow: 0 0 10px var(--amber-glow); animation: pulse 1.4s var(--ease) infinite; }
    .dot.ok     { background: var(--ok);    box-shadow: 0 0 8px var(--ok-glow); }
    .dot.bad    { background: var(--bad);   box-shadow: 0 0 8px var(--bad-glow); }
    .dot.paused { background: var(--paused); }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin  { to { transform: rotate(360deg); } }

    .rise { animation: rise 0.5s var(--ease-out) both; }

    /* ---- spinner ---- */
    .spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--line-2); border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }

    /* ---- scrollbars ---- */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--line-2); border-radius: 10px;
      border: 2px solid transparent; background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: content-box; }
    * { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

    ::selection { background: var(--accent); color: #fff; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* KaTeX math (rendered into v-html content; inherits text color) */
    .katex { font-size: 1.04em; }
    .katex-display { overflow-x: auto; overflow-y: hidden; margin: 0.9em 0; padding: 2px 0; }
    .md-mathraw { color: var(--amber); font-family: var(--mono); font-size: 0.9em; }

    /* Full-screen loading shim shown while async overlay chunks (ProjectWorkspace
       subtree, modals) are being fetched. */
    .ws-overlay-loading, .overlay-loading {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
    }
    .tab-fallback { display: flex; align-items: center; justify-content: center; min-height: 200px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
